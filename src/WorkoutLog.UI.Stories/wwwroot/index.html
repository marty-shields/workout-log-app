<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkoutLog.UI.Stories</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Story CSS and JS go in iframe.html, not here. -->
    <link rel="stylesheet" href="css/blazor-ui.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-progress">
            <svg>
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="text"></div>
            <img src="_content/BlazingStory/images/icon.min.svg" />
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Story scripts go in iframe.html, not here. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // XML doc files have no fingerprint, so they are fetched past the browser cache.
        Blazor.start({
            loadBootResource: (type, name, defaultUri, integrity) =>
                name.endsWith('.xml') ? fetch(defaultUri, { cache: 'reload', integrity }) : undefined
        });
    </script>
</body>

</html>
