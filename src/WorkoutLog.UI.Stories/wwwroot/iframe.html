<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkoutLog.UI.Stories</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- CSS and JS for the story canvas go here, not in index.html. -->
    <link rel="stylesheet" href="css/blazor-ui.css" />
    <link rel="stylesheet" href="_content/WorkoutLog.UI/css/tokens.css" />
    <link rel="stylesheet" href="_content/WorkoutLog.UI/css/base.css" />
    <link rel="stylesheet" href="WorkoutLog.UI.Stories.styles.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Scripts for the story canvas go here, not in index.html. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // XML doc files have no fingerprint, so they are fetched past the browser cache.
        Blazor.start({
            loadBootResource: (type, name, defaultUri, integrity) =>
                name.endsWith('.xml') ? fetch(defaultUri, { cache: 'reload', integrity }) : undefined
        });
    </script>
</body>

</html>
