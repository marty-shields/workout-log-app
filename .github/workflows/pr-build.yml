# Runs on every PR to main: the dev pipeline, then the QA pipeline once the build and its tests pass.
name: PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    uses: ./.github/workflows/dev-pipeline.yml

  qa:
    needs: dev
    uses: ./.github/workflows/qa-pipeline.yml
