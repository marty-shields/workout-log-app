# Runs on every PR to main: the dev pipeline, then the QA pipeline once the build and its tests pass. In the merge queue (merge_group) it runs the dev
# pipeline only, on the PR merged with main and the PRs ahead of it; the QA shards (about an hour) stay on the PR.
name: PR build

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    uses: ./.github/workflows/dev-pipeline.yml

  # Fails when a story clips, overflows or wraps at the narrowest card.
  story-layout:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-maui

      - name: Build the stories
        run: dotnet build src/WorkoutLog.UI.Stories

      - name: Check the story layout
        run: |
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          dotnet run --project src/WorkoutLog.UI.Stories --no-build --urls http://localhost:5056 > "$RUNNER_TEMP/stories.log" 2>&1 &
          SERVER_PID=$!
          ready=false
          for _ in $(seq 60); do
            if curl -fs -o /dev/null http://localhost:5056/iframe.html; then ready=true; break; fi
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Stories server did not come up:"
            cat "$RUNNER_TEMP/stories.log"
            exit 1
          fi
          node .github/scripts/check-story-layout.mjs http://localhost:5056 "$(command -v google-chrome)" || { cat "$RUNNER_TEMP/stories.log"; exit 1; }

  qa:
    if: ${{ github.event_name == 'pull_request' }}
    needs: dev
    uses: ./.github/workflows/qa-pipeline.yml

  # The ruleset requires "qa / emulator-e2e-tests", which the skipped qa job above does not report in the merge queue. This reports it there.
  qa-in-queue:
    name: qa / emulator-e2e-tests
    if: ${{ github.event_name == 'merge_group' }}
    needs: dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The QA shards ran on the PR; the merge queue runs the dev pipeline only."

