# Publishes the stories site to GitHub Pages on every push to main.
name: Stories site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stories-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Pages compresses files itself, so the publish writes none.
      - name: Publish
        run: dotnet publish src/WorkoutLog.UI.Stories -c Release -o publish -p:CompressionEnabled=false

      # The site is served under /<repo>/, not the root.
      - name: Set the base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH/\" />|" publish/wwwroot/index.html publish/wwwroot/iframe.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
