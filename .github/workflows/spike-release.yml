# SPIKE ONLY (US-26): the release workflow with spike settings. Never merged.
name: Spike release

on:
  push:
    branches: ['spike/**']

permissions:
  contents: read

concurrency:
  group: spike-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG_PREFIX: spike-v
  E2E_SHARDS: 8
  CHROMEDRIVER_VERSION: ''
  CHROMEDRIVER_SHA256: ''
  CERT_SHA256: 'E4:37:88:10:3D:1A:15:73:71:D6:1E:D4:F8:30:9C:27:54:6B:1A:B8:44:46:52:16:44:D7:43:CA:5E:8C:A1:E9'

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      code: ${{ steps.next.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(git rev-parse origin/main)
          .github/spike/next-version.sh "$TAG_PREFIX" "$target"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/pr-build.yml

  # One emulator per runner; each shard runs whole features (e2e-shard.sh). The matrix size matches E2E_SHARDS.
  e2e:
    needs: version
    if: needs.version.outputs.release == 'true'
    name: e2e (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      AVD: WorkoutLog_API36
      SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
      RESULTS: tests/WorkoutLog.E2E.Tests/TestResults/E2E
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo "::group::Host"
          echo "CPUs: $(nproc)"; free -m; df -h / | tail -n 1
          echo "CPU virtualisation flags: $(grep -c -E '(vmx|svm)' /proc/cpuinfo || true)"
          echo "::endgroup::"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # avdmanager and the emulator look for AVDs in different default folders; ANDROID_AVD_HOME sets one for both.
      - name: Start the emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "::group::Emulator libraries"
          sudo apt-get install -y --no-install-recommends libpulse0 > /dev/null
          echo "::endgroup::"
          echo "::group::Install the emulator and image"
          (yes || true) | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" --install emulator "$SYSTEM_IMAGE"
          "$sdk/sdkmanager" --list_installed | grep -E "emulator|system-images|platform-tools|build-tools"
          echo "::endgroup::"
          echo "::group::Create the AVD"
          echo no | "$sdk/avdmanager" create avd -n "$AVD" -k "$SYSTEM_IMAGE" -d pixel_7
          "$sdk/avdmanager" list avd
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-} ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          avd_path=$("$sdk/avdmanager" list avd | sed -n 's/^ *Path: //p' | head -n 1)
          cat "$avd_path/config.ini"
          echo "::endgroup::"
          echo "::group::Emulator version and acceleration"
          "$ANDROID_HOME/emulator/emulator" -version | head -n 3
          "$ANDROID_HOME/emulator/emulator" -accel-check
          echo "::endgroup::"
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD" -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -verbose > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          echo "Emulator started, pid $(cat "$RUNNER_TEMP/emulator.pid")"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.402.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Appium
        working-directory: tests/WorkoutLog.E2E.Tests
        run: npm ci --ignore-scripts

      - name: Build the App (Debug)
        id: app
        run: dotnet build src/WorkoutLog.App -f net10.0-android

      # Reports every 15 s; fails at once if the emulator process ends, and after 15 minutes.
      - name: Wait for the emulator
        id: boot
        run: |
          pid=$(cat "$RUNNER_TEMP/emulator.pid")
          log="$RUNNER_TEMP/emulator.log"
          start=$SECONDS
          shown=0
          while true; do
            elapsed=$((SECONDS - start))
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error title=Emulator::The emulator process ended after ${elapsed}s."
              echo "::group::emulator.log"; cat "$log"; echo "::endgroup::"
              exit 1
            fi
            state=$(timeout 10 adb get-state 2>/dev/null || echo none)
            boot=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            anim=$(timeout 10 adb shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r' || true)
            echo "[${elapsed}s] adb: $state, sys.boot_completed: ${boot:-?}, bootanim: ${anim:-?}, emulator.log: $(wc -l < "$log") lines"
            lines=$(wc -l < "$log")
            if (( lines > shown )); then
              tail -n +"$((shown + 1))" "$log" | tail -n 5 | sed 's/^/    | /'
              shown=$lines
            fi
            [[ "$boot" == 1 ]] && break
            if (( elapsed > 900 )); then
              echo "::error title=Emulator::Not booted after 15 minutes."
              echo "::group::emulator.log"; cat "$log"; echo "::endgroup::"
              exit 1
            fi
            sleep 15
          done
          echo "Booted in $((SECONDS - start))s."
          adb shell input keyevent 82
          adb shell wm dismiss-keyguard || true
          # System "isn't responding" dialogs (e.g. Play services on a busy CPU) would cover the app and take its taps.
          adb shell settings put global hide_error_dialogs 1
          echo "::group::Device"
          adb devices -l
          adb shell getprop ro.build.fingerprint
          adb shell wm size
          adb shell wm density
          adb shell dumpsys webviewupdate | grep -i -E "current webview package|webview packages"
          echo "::endgroup::"
          mkdir -p "$RESULTS"
          nohup adb logcat -v threadtime > "$RESULTS/logcat.txt" 2>&1 &

      - name: Pinned Chromedriver
        if: env.CHROMEDRIVER_VERSION != ''
        run: |
          webview=$(adb shell dumpsys webviewupdate | sed -n 's/.*Current WebView package (name, version): ([^,]*, \([0-9.]*\)).*/\1/p')
          if [[ "${webview%%.*}" != "${CHROMEDRIVER_VERSION%%.*}" ]]; then
            echo "::error title=Chromedriver::WebView $webview, pinned Chromedriver $CHROMEDRIVER_VERSION: update the pin in release.yml (docs/08-dev-setup-build.md)."
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/chromedriver.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROMEDRIVER_VERSION/linux64/chromedriver-linux64.zip"
          echo "$CHROMEDRIVER_SHA256  $RUNNER_TEMP/chromedriver.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/chromedriver.zip"
          echo "CHROMEDRIVER=$RUNNER_TEMP/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"

      - name: E2E tests
        run: |
          dotnet build tests/WorkoutLog.E2E.Tests
          filter=$(.github/spike/e2e-shard.sh "${{ matrix.shard }}" "$E2E_SHARDS")
          if [[ -z "$filter" ]]; then
            echo "::notice title=E2E::Shard ${{ matrix.shard }}/$E2E_SHARDS has no features."
            exit 0
          fi
          parameters=('TestRunParameters.Parameter(name="DeviceUdid", value="emulator-5554")')
          if [[ -n "${CHROMEDRIVER:-}" ]]; then
            parameters+=("TestRunParameters.Parameter(name=\"ChromedriverExecutable\", value=\"$CHROMEDRIVER\")")
          fi
          # Failed scenarios become annotations and the step writes a results table to the job summary (T95).
          dotnet test tests/WorkoutLog.E2E.Tests --no-build --filter "$filter" --logger "console;verbosity=detailed" \
            --logger GitHubActions --logger "trx;LogFileName=e2e.trx" --results-directory "$RESULTS/trx" \
            -- "${parameters[@]}" RunConfiguration.CollectSourceInformation=true

      # Shard 1 only. Runs even when the E2E tests fail, once the emulator and .NET are ready.
      - name: Release smoke build (x64, debug key)
        id: smoke
        if: ${{ !cancelled() && matrix.shard == 1 && steps.app.outcome == 'success' && steps.boot.outcome == 'success' }}
        run: |
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-x64 -o "$RUNNER_TEMP/smoke"

      - name: Release smoke launch
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: .github/spike/release-smoke.sh "$RUNNER_TEMP/smoke/uk.martinshields.workoutlog-Signed.apk"

      # Runs on a failure or a cancel too, so the logs are kept.
      - name: Keep the emulator log
        if: always()
        run: |
          mkdir -p "$RESULTS"
          cp "$RUNNER_TEMP/emulator.log" "$RESULTS/" || true
          adb shell dumpsys activity activities > "$RESULTS/activities.txt" 2>&1 || true
          adb exec-out screencap -p > "$RESULTS/final-screen.png" 2>/dev/null || true
          ls -la "$RESULTS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: ${{ env.RESULTS }}/
          retention-days: 1
          if-no-files-found: ignore

  release:
    needs: [version, build, e2e]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-spike
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.402.1

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: base64 -d <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"

      # Passwords reach MSBuild through env: and never appear on the command line.
      - name: Build the signed Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-arm64 \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$CODE" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="$RELEASE_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:RELEASE_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:RELEASE_KEYSTORE_PASSWORD \
            -o "$RUNNER_TEMP/release"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the APK
        run: .github/spike/check-apk.sh "$RUNNER_TEMP/release/uk.martinshields.workoutlog-Signed.apk" "$VERSION" "$CODE" "$CERT_SHA256" "$RUNNER_TEMP/out"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG_PREFIX$VERSION"
          apk="$RUNNER_TEMP/out/WorkoutLog-$VERSION.apk"
          gh release create "$tag" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" \
            --generate-notes --notes "$(cat "$RUNNER_TEMP/out/notes.md")" --draft
