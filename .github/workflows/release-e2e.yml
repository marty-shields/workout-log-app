# Runs a Release build of this commit (x64, debug key, never published) on an emulator: it starts cleanly (release-smoke.sh),
# then the @release scenarios and the @backup scenario run on it (docs/e2e-tests.md). For the release workflow, and for PRs
# that change the E2E tests or the export and import code, which trimming is most likely to break.
name: Release E2E

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - tests/WorkoutLog.E2E.Tests/**
      - src/WorkoutLog.Core/Export/**
      - src/WorkoutLog.Core/Import/**
      - .github/workflows/release-e2e.yml
      - .github/actions/**
      - src/WorkoutLog.App/**
      - .github/scripts/e2e-run.sh
      - .github/scripts/chromedriver.sh
      - .github/scripts/emulator-start.sh
      - .github/scripts/emulator-wait.sh
      - .github/scripts/release-smoke.sh

permissions:
  contents: read

concurrency:
  group: release-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      E2E_APP_PACKAGE: uk.martinshields.workoutlog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the emulator
        run: .github/scripts/emulator-start.sh

      - uses: ./.github/actions/setup-maui

      - name: Build the Release APK (x64, debug key)
        run: |
          dotnet restore src/WorkoutLog.App
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-x64 --no-restore -o "$RUNNER_TEMP/release"
          echo "E2E_APP_APK=$RUNNER_TEMP/release/$E2E_APP_PACKAGE-Signed.apk" >> "$GITHUB_ENV"

      - name: Build the E2E tests
        run: dotnet build tests/WorkoutLog.E2E.Tests

      # Failed scenarios run again, up to 3 tries in all (e2e-run.sh).
      - uses: ./.github/actions/emulator-e2e
        with:
          artifact: release-e2e
          timeout-minutes: 40
          run: |
            .github/scripts/release-smoke.sh "$E2E_APP_APK"
            .github/scripts/e2e-run.sh "Category=release|Category=backup" 3
