# Runs a Release build of this commit (x64, debug key, never published) on an emulator: it starts cleanly (release-smoke.sh),
# then the @release scenarios and the @backup scenario run on it (docs/e2e-tests.md). For the release workflow, and for PRs
# that change the E2E tests or the export and import code, which trimming is most likely to break.
name: Release E2E

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - tests/WorkoutLog.E2E.Tests/**
      - src/WorkoutLog.Core/Export/**
      - src/WorkoutLog.Core/Import/**
      - .github/workflows/release-e2e.yml
      - src/WorkoutLog.App/**
      - .github/scripts/e2e-run.sh
      - .github/scripts/chromedriver.sh
      - .github/scripts/emulator-start.sh
      - .github/scripts/emulator-wait.sh
      - .github/scripts/release-smoke.sh

permissions:
  contents: read

concurrency:
  group: release-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RESULTS: tests/WorkoutLog.E2E.Tests/TestResults/E2E
      E2E_APP_PACKAGE: uk.martinshields.workoutlog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the emulator
        run: .github/scripts/emulator-start.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Workload set matching the SDK in global.json; bump both together.
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.402.1

      - name: Build the Release APK (x64, debug key)
        run: |
          dotnet restore src/WorkoutLog.App
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-x64 --no-restore -o "$RUNNER_TEMP/release"
          echo "E2E_APP_APK=$RUNNER_TEMP/release/$E2E_APP_PACKAGE-Signed.apk" >> "$GITHUB_ENV"

      - name: Build the E2E tests
        run: dotnet build tests/WorkoutLog.E2E.Tests

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Appium
        working-directory: tests/WorkoutLog.E2E.Tests
        run: npm ci --ignore-scripts

      - name: Wait for the emulator
        run: .github/scripts/emulator-wait.sh "$RESULTS"

      - name: Launch
        run: .github/scripts/release-smoke.sh "$E2E_APP_APK"

      - name: Pinned Chromedriver
        run: |
          chromedriver=$(.github/scripts/chromedriver.sh "$RUNNER_TEMP")
          echo "CHROMEDRIVER=$chromedriver" >> "$GITHUB_ENV"

      # Times out after 40 minutes; the logs still upload. Failed scenarios run again, up to 3 tries in all (e2e-run.sh).
      - name: E2E tests
        timeout-minutes: 40
        run: .github/scripts/e2e-run.sh "Category=release|Category=backup" 3

      # Runs on a failure or a cancel too. Each adb call is time-limited.
      - name: Keep the emulator log
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p "$RESULTS"
          cp "$RUNNER_TEMP/emulator.log" "$RESULTS/" || true
          timeout 30 adb exec-out screencap -p > "$RESULTS/final-screen.png" 2>/dev/null || true
          echo "::group::Health (last 20)"; tail -n 20 "$RESULTS/health.log" 2>/dev/null || true; echo "::endgroup::"
          ls -la "$RESULTS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-e2e
          path: ${{ env.RESULTS }}/
          retention-days: 1
          if-no-files-found: ignore
