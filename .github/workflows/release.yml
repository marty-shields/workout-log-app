# Releases main by hand (Actions > Release > Run workflow): works out the next version from the semver labels of the PRs
# merged since the last v* tag, builds and tests, runs the E2E suite on emulators (qa-pipeline.yml), then, after the owner approves
# the release environment, builds the signed APK and publishes the GitHub release with its v* tag (docs/06-dev-setup-build.md).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The release signing cert's SHA-256 (06).
  CERT_SHA256: '5D:6A:C3:4B:86:B8:29:8D:04:DE:18:5C:9B:D8:3C:27:C8:31:76:CB:F9:BD:F8:35:A8:CA:C4:95:57:1B:CD:AC'

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      code: ${{ steps.next.outputs.code }}
    steps:
      - name: Main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Release::Releases run from main only, not $GITHUB_REF."
          exit 1

      - name: Release cert pinned
        if: env.CERT_SHA256 == ''
        run: |
          echo "::error title=Release::CERT_SHA256 in release.yml is empty: set it to the release cert's SHA-256 (docs/06-dev-setup-build.md)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/next-version.sh v "$GITHUB_SHA"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/dev-pipeline.yml

  e2e:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/qa-pipeline.yml

  # A Release build of the same commit (x64, debug key, never published) starts cleanly on an emulator.
  release-smoke:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESULTS: release-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the emulator
        run: .github/scripts/emulator-start.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.402.1

      - name: Build the Release APK (x64, debug key)
        run: |
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-x64 -o "$RUNNER_TEMP/smoke"

      - name: Wait for the emulator
        run: .github/scripts/emulator-wait.sh "$RESULTS"

      - name: Launch
        run: .github/scripts/release-smoke.sh "$RUNNER_TEMP/smoke/uk.martinshields.workoutlog-Signed.apk"

      # Runs on a failure or a cancel too, so the logs are kept.
      - name: Keep the emulator log
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p "$RESULTS"
          cp "$RUNNER_TEMP/emulator.log" "$RESULTS/" || true
          timeout 30 adb exec-out screencap -p > "$RESULTS/final-screen.png" 2>/dev/null || true
          echo "::group::Health (last 20)"; tail -n 20 "$RESULTS/health.log" 2>/dev/null || true; echo "::endgroup::"
          ls -la "$RESULTS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-smoke
          path: ${{ env.RESULTS }}/
          retention-days: 1
          if-no-files-found: ignore

  # Waits for the owner's approval of the release environment, which holds the signing secrets.
  release:
    needs: [version, build, e2e, release-smoke]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.402.1

      # Packages are downloaded before any secret is on the runner.
      - name: Restore
        run: dotnet restore src/WorkoutLog.App -r android-arm64

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: base64 -d <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"

      # Passwords reach MSBuild through env: and never appear on the command line.
      - name: Build the signed Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-arm64 --no-restore \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$CODE" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="$RELEASE_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:RELEASE_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:RELEASE_KEYSTORE_PASSWORD \
            -o "$RUNNER_TEMP/release"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the APK
        run: .github/scripts/check-apk.sh "$RUNNER_TEMP/release/uk.martinshields.workoutlog-Signed.apk" "$VERSION" "$CODE" "$CERT_SHA256" "$RUNNER_TEMP/out"

      - name: Check Android Auto Backup is on
        run: .github/scripts/check-backup.sh "$RUNNER_TEMP/release/uk.martinshields.workoutlog-Signed.apk" true

      # Creates the v* tag on this commit with the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/out/WorkoutLog-$VERSION.apk"
          gh release create "v$VERSION" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" \
            --generate-notes --notes "$(cat "$RUNNER_TEMP/out/notes.md")"
