# Installs the Debug build of the last release (the latest v* tag) on an emulator, where that release's own E2E project saves
# workouts through it, then installs this commit's Debug build over it and checks them (upgrade-e2e.sh, docs/e2e-tests.md).
# This job builds both, so the same debug key signs them. For the release workflow, and for PRs that change the database
# code or the E2E tests.
name: Upgrade E2E

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - tests/WorkoutLog.E2E.Tests/**
      - src/WorkoutLog.Core/Data/**
      - .github/workflows/upgrade-e2e.yml
      - .github/actions/**
      - .github/scripts/emulator-dialogs.sh
      - .github/scripts/previous-apk.sh
      - .github/scripts/upgrade-e2e.sh
      - .github/scripts/upgrade-seed-ref.sh
      - src/WorkoutLog.App/**
      - .github/scripts/e2e-run.sh
      - .github/scripts/chromedriver.sh
      - .github/scripts/emulator-start.sh
      - .github/scripts/emulator-sdk.sh
      - .github/android-emulator.env
      - .github/scripts/emulator-wait.sh

permissions:
  contents: read

concurrency:
  group: upgrade-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The tags, for the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Start the emulator
        uses: ./.github/actions/start-emulator

      - uses: ./.github/actions/setup-maui

      - name: Build the last release's Debug APK
        run: |
          tag=$(.github/scripts/previous-apk.sh "$RUNNER_TEMP/previous.apk")
          echo "::notice title=Upgrade::Upgrading from $tag."
          echo "E2E_PREVIOUS_APK=$RUNNER_TEMP/previous.apk" >> "$GITHUB_ENV"

      - name: Build the App and the E2E tests
        run: |
          dotnet build src/WorkoutLog.App -f net10.0-android
          dotnet build tests/WorkoutLog.E2E.Tests

      # A failed try starts again from an uninstalled app, up to 3 tries in all.
      - uses: ./.github/actions/emulator-e2e
        with:
          artifact: upgrade-e2e
          timeout-minutes: 30
          run: .github/scripts/upgrade-e2e.sh "$E2E_PREVIOUS_APK" 3
