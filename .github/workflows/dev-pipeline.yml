# Builds the solution and runs the UI and Core tests, checks the E2E step bindings and that Android Auto Backup is on only
# in Release, and keeps the Debug APK and E2E tests for the QA pipeline, for the PR build (pr-build.yml) and the release
# workflow.
name: Dev pipeline

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dev-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails on an E2E step with no step definition or more than one.
      - name: Check the E2E step bindings
        run: python3 -I .github/scripts/e2e-step-check.py tests/WorkoutLog.E2E.Tests

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Workload set matching the SDK in global.json; bump both together.
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.402.1

      - name: Build
        id: build
        run: dotnet build WorkoutLog.slnx

      # Failed tests are reported as annotations and in the job summary.
      - name: Core tests
        run: dotnet test tests/WorkoutLog.Core.Tests --no-build --logger GitHubActions -- RunConfiguration.CollectSourceInformation=true

      # Runs even when the Core tests fail.
      - name: UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/WorkoutLog.UI.Tests --no-build --logger GitHubActions -- RunConfiguration.CollectSourceInformation=true

      # Android Auto Backup is off in the Debug APK.
      - name: Check the Debug APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/scripts/check-backup.sh src/WorkoutLog.App/bin/Debug/net10.0-android/uk.martinshields.workoutlog.debug-Signed.apk false

      # The QA pipeline's shards download these. obj is included for dotnet test --no-build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: |
            src/WorkoutLog.App/bin/Debug/net10.0-android/uk.martinshields.workoutlog.debug-Signed.apk
            tests/WorkoutLog.E2E.Tests/bin
            tests/WorkoutLog.E2E.Tests/obj
          retention-days: 1
          if-no-files-found: error

  # Android Auto Backup is on in the Release APK (x64, debug key, never published).
  backup-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Workload set matching the SDK in global.json; bump both together.
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.402.1

      - name: Build the Release APK (x64, debug key)
        run: |
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-x64 -o "$RUNNER_TEMP/backup"

      - name: Check the Release APK
        run: .github/scripts/check-backup.sh "$RUNNER_TEMP/backup/uk.martinshields.workoutlog-Signed.apk" true
