# Builds the solution and runs the UI and Core tests with coverage, tests the CI scripts, checks the E2E step bindings and the backup rules in the Debug and
# Release APKs, and keeps the Debug APK and E2E tests for the QA pipeline, for the PR build (pr-build.yml) and the release
# workflow.
name: Dev pipeline

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dev-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # next-version.sh, e2e-shard-plan.sh, e2e-trx.sh, upgrade-seed-ref.sh, check-filler-comments.py and coverage-summary.py against stubs, sample files and throwaway repos.
      - name: Test the CI scripts
        run: .github/scripts/tests/run.sh

      # shellcheck over .github/scripts and the pinned, SHA-256-checked actionlint over the workflows (and their run steps).
      - name: Lint the CI scripts and workflows
        run: .github/scripts/lint-ci.sh

      # Fails on an E2E step with no step definition or more than one.
      - name: Check the E2E step bindings
        run: python3 -I .github/scripts/e2e-step-check.py tests/WorkoutLog.E2E.Tests

      # Fails on an XML doc comment that only restates the name of its member.
      - name: Check for filler doc comments
        run: python3 -I .github/scripts/check-filler-comments.py

      - uses: ./.github/actions/setup-maui

      - name: Build
        id: build
        run: dotnet build WorkoutLog.slnx

      # Failed tests are reported as annotations and in the job summary. A test host that hangs for 5 minutes is killed and fails the step.
      - name: Core tests
        run: dotnet test tests/WorkoutLog.Core.Tests --no-build --logger GitHubActions --blame-hang-timeout 5m --collect "Code Coverage;Format=cobertura" --results-directory "$RUNNER_TEMP/coverage/core" -- RunConfiguration.CollectSourceInformation=true

      # Runs even when the Core tests fail.
      - name: UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/WorkoutLog.UI.Tests --no-build --logger GitHubActions --blame-hang-timeout 5m --collect "Code Coverage;Format=cobertura" --results-directory "$RUNNER_TEMP/coverage/ui" -- RunConfiguration.CollectSourceInformation=true

      # Line and branch coverage of Core (from the Core tests) and UI (from the UI tests) in the job summary. Fails when either line coverage is more than 1 point
      # below .github/coverage-baseline.tsv. The Cobertura XML is the coverage artifact.
      - name: Coverage summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 -I .github/scripts/coverage-summary.py --baseline .github/coverage-baseline.tsv \
            WorkoutLog.Core="$(find "$RUNNER_TEMP/coverage/core" -name '*.cobertura.xml')" \
            WorkoutLog.UI="$(find "$RUNNER_TEMP/coverage/ui" -name '*.cobertura.xml')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage/**/*.cobertura.xml
          retention-days: 14
          if-no-files-found: warn

      # Nothing is backed up or transferred from the Debug APK.
      - name: Check the Debug APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/scripts/check-backup.sh src/WorkoutLog.App/bin/Debug/net10.0-android/uk.martinshields.workoutlog.debug-Signed.apk false no_backup

      # The QA pipeline's shards download these. obj is included for dotnet test --no-build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: |
            src/WorkoutLog.App/bin/Debug/net10.0-android/uk.martinshields.workoutlog.debug-Signed.apk
            tests/WorkoutLog.E2E.Tests/bin
            tests/WorkoutLog.E2E.Tests/obj
          retention-days: 1
          if-no-files-found: error

  # Only the database is backed up and transferred from the Release APK (x64, debug key, never published). The arm64 Release
  # APK, built as the release builds it, must hold arm64-v8a only.
  backup-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-maui

      - name: Build the Release APK (x64, debug key)
        run: |
          dotnet restore src/WorkoutLog.App
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-x64 --no-restore -o "$RUNNER_TEMP/backup"

      - name: Check the Release APK
        run: .github/scripts/check-backup.sh "$RUNNER_TEMP/backup/uk.martinshields.workoutlog-Signed.apk" true backup_rules

      - name: Build the Release APK (arm64, debug key)
        run: |
          dotnet publish src/WorkoutLog.App -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -r android-arm64 --no-restore -o "$RUNNER_TEMP/arm64"

      - name: Check the arm64 Release APK holds arm64 only
        run: .github/scripts/check-abi.sh "$RUNNER_TEMP/arm64/uk.martinshields.workoutlog-Signed.apk"
