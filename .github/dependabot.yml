# Update PRs (NuGet daily, the rest weekly), labelled semver:patch with a chore(deps) title.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["semver:patch"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/tests/WorkoutLog.E2E.Tests"
    schedule:
      interval: "weekly"
    labels: ["semver:patch"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The driver's peer range names one Appium major, so the two move together, a major included.
      appium:
        patterns: ["appium", "appium-uiautomator2-driver"]
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["semver:patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["semver:patch"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
