# The end of every emulator E2E job (qa-pipeline.yml's shards, release-e2e.yml, upgrade-e2e.yml): installs Appium, waits
# for the emulator, gets the pinned Chromedriver, runs the tests, then keeps the emulator log and uploads the results, also
# after a failure or a timeout. A failed run says in the job summary whether it looks like infrastructure
# (classify-shard-failure.sh). Before it, the job checks out the repo, starts the emulator (emulator-start.sh) so it boots
# while the job builds, and gets the App and the E2E tests ready.
name: Emulator E2E
description: Runs E2E tests on the emulator emulator-start.sh started and uploads the results.

inputs:
  run:
    description: Bash commands that run the tests. RESULTS, CHROMEDRIVER and the job's env are set.
    required: true
  timeout-minutes:
    description: Minutes the commands may take. After a timeout the log and the results still upload.
    required: true
  artifact:
    description: Name of the results artifact.
    required: true
  results:
    description: The folder the E2E scripts write to (RESULTS).
    default: tests/WorkoutLog.E2E.Tests/TestResults/E2E

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install Appium
      shell: bash
      working-directory: tests/WorkoutLog.E2E.Tests
      run: npm ci --ignore-scripts

    - name: Wait for the emulator
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: .github/scripts/emulator-wait.sh "$RESULTS"

    - name: Pinned Chromedriver
      shell: bash
      run: |
        chromedriver=$(.github/scripts/chromedriver.sh "$RUNNER_TEMP")
        echo "CHROMEDRIVER=$chromedriver" >> "$GITHUB_ENV"

    # A composite step takes no timeout-minutes, and a step timeout would also stop the two steps below.
    - name: E2E tests
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        COMMANDS: ${{ inputs.run }}
        MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        mkdir -p "$RESULTS"
        set +e
        timeout --kill-after=1m "${MINUTES}m" bash -euo pipefail -c "$COMMANDS" 2>&1 | tee "$RESULTS/e2e-output.log"
        status=${PIPESTATUS[0]}
        set -e
        if (( status == 124 || status == 137 )); then
          echo "::error title=E2E::The tests didn't finish in $MINUTES minutes."
        fi
        if (( status != 0 )); then
          verdict=$(.github/scripts/classify-shard-failure.sh "$RESULTS/e2e-output.log")
          if [[ "$verdict" == infra ]]; then
            note="The log shows the emulator or its UiAutomator2 server failing, and no assertion failing. Rerun this job once. If it fails again, treat it as a real failure."
          else
            note="No emulator failure signature, or an assertion failed. Do not rerun: find the cause."
          fi
          echo "::notice title=Shard failure::$verdict. $note"
          printf "### Shard failure: \`%s\`\n\n%s\n" "$verdict" "$note" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"

    # Each adb call is time-limited.
    - name: Keep the emulator log
      if: always()
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: |
        mkdir -p "$RESULTS"
        cp "$RUNNER_TEMP"/emulator*.log "$RESULTS/" || true
        timeout 30 adb shell dumpsys activity activities > "$RESULTS/activities.txt" 2>&1 || true
        timeout 30 adb exec-out screencap -p > "$RESULTS/final-screen.png" 2>/dev/null || true
        echo "::group::Health (last 20)"; tail -n 20 "$RESULTS/health.log" 2>/dev/null || true; echo "::endgroup::"
        ls -la "$RESULTS"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: ${{ inputs.artifact }}-${{ github.run_attempt }}
        path: ${{ inputs.results }}/
        retention-days: ${{ success() && 1 || 7 }}
        if-no-files-found: ignore
