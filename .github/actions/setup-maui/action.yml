# The .NET SDK in global.json and the maui-android workload set that matches it, for every job that builds the App or the
# stories. This is the only place the workload set is pinned: bump it with the SDK in global.json
# (`dotnet workload search version`). It also decides the WebAssembly SDK pack the Stories lock file records, so a job
# without it fails the locked restore. e2e-local.sh reads the pin from here.
name: Set up .NET for MAUI Android
description: Installs the .NET SDK in global.json and the pinned maui-android workload set.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Install the MAUI Android workload
      shell: bash
      run: dotnet workload install maui-android --version 10.0.402.1
